name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static pages
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/download-artifact@v4
        with:
          name: indexnow
      # Tell Bing/Yandex about the pages. Google uses the sitemap in Search Console.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          sleep 30
          curl -sS -w '%{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json https://api.indexnow.org/indexnow
